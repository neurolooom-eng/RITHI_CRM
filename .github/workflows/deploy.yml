name: Deploy to GitHub Pages

# Builds the Vite app and publishes the static site to the `gh-pages` branch.
# We push to a branch (a normal git operation the workflow token is allowed to
# do) instead of using the Pages API, which is blocked for the token here.
#
# After the first successful run, if the site isn't live yet, set:
#   Settings -> Pages -> Build and deployment -> Source: "Deploy from a branch"
#   Branch: gh-pages  /  (root)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

# THE DEPLOY GETS ITS OWN GROUP, and previews must never be in it.
#
# Both workflows push to `gh-pages`, so sharing one group looked right — but a
# run that is still QUEUED is cancelled by ANY newer run entering its group,
# whatever that run's own cancel-in-progress says. So pushing a branch seconds
# after merging (which is the normal loop here: merge, then sync the branch)
# started a preview that killed the deploy before it had a runner. Run #322 was
# cancelled 8s in and the site silently stayed a version behind.
#
# Within THIS group cancelling is still right: a second push to `main` supersedes
# the build of the first, and only the last one should reach the site.
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          # Keep the rest of the branch — `preview/<branch>/` folders published
          # by preview.yml live there, and a default publish would wipe them.
          # The cost is that superseded (hashed) assets are never pruned.
          keep_files: true
          # serve assets as-is (no Jekyll processing)
          enable_jekyll: false
